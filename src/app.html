<title>nibble</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: phone-shaped column. Flower-meadow scene on top, cream sheet with the selected pet's to-do list below; modals slide up from the bottom */
:root{
  color-scheme:light;
  --ink:#4a3530; --muted:#9b7f78; --cream:#fffaf3; --paper:#fff4f7; --line:#efdcd6;
  --pink:#ff8fb1; --pink-deep:#ee6690; --pink-soft:#ffd9e5; --green:#8fd18a; --green-deep:#5ea866; --green-soft:#e1f4d8;
  --yellow:#ffd36e; --sky:#ffe1eb;
  --display:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#f6e6ea}
body{background:#f6e6ea;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-weight:500}
button,input{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink-deep);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--cream);position:relative;box-shadow:0 0 0 2px var(--ink)}
@media (min-width:500px){.app{margin-block:16px;border-radius:28px;overflow:hidden;min-height:calc(100vh - 32px)}}

/* ---------- scene ---------- */
.scene{position:relative;height:min(52vh,430px);min-height:330px;overflow:hidden;background:var(--sky);user-select:none;-webkit-user-select:none}
.scene>svg.bg,.scene>svg.fg{position:absolute;left:0;width:100%;display:block}
.scene>svg.bg{top:0;height:100%}
.scene>svg.fg{bottom:-2px;height:17%;z-index:4;pointer-events:none}
.walkers{position:absolute;inset:0;z-index:1;pointer-events:none}
.walker{position:absolute;width:var(--w);animation:walk var(--d) ease-in-out infinite;pointer-events:auto}
.walker>div{animation:flip var(--d) steps(1) infinite}
.walker svg{width:100%;display:block;animation:hop .5s ease-in-out infinite alternate}
@keyframes walk{0%,100%{transform:translateX(0)}50%{transform:translateX(var(--dist))}}
@keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
@keyframes hop{to{transform:translateY(-3px)}}
.hero{position:absolute;left:50%;bottom:7%;width:min(52%,230px);transform:translateX(-50%);z-index:3;cursor:pointer}
.hero svg{width:100%;display:block;overflow:visible}
.bob{animation:bob 2.8s ease-in-out infinite;transform-origin:50% 95%}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(-4px) scale(.99,1.015)}}
.hero.wiggle .bob{animation:wiggle .6s ease}
@keyframes wiggle{25%{transform:rotate(-7deg) scale(1.03)}50%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}}
.hero.jump .bob{animation:jump .75s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{0%{transform:scale(1.1,.86)}40%{transform:translateY(-30px) scale(.94,1.08)}75%{transform:scale(1.06,.93)}100%{transform:none}}
.blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97.5%{transform:scaleY(.1)}}
.spark{animation:twinkle 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
.zz{font-family:var(--display);font-weight:700;fill:var(--muted);animation:zz 3s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(12px,-26px)}}
.box-hero .lidg{animation:boxshake 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes boxshake{0%,70%,100%{transform:none}75%{transform:rotate(-6deg) translateY(-4px)}80%{transform:rotate(5deg) translateY(-6px)}85%{transform:rotate(-3deg)}90%{transform:none}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:6}
.fx span{position:absolute;font-size:22px;color:var(--pink-deep);animation:rise 1.3s ease-out forwards;text-shadow:0 0 0 #fff}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-130px) scale(1.25)}}
.bubble{position:absolute;left:50%;bottom:calc(7% + min(52vw,230px) * var(--k,.86));transform:translateX(-50%);z-index:6;max-width:70%;background:#fff;border:2.5px solid var(--ink);border-radius:20px;padding:8px 14px;font-family:var(--display);font-weight:500;font-size:16px;line-height:1.25;text-align:center;transition:opacity .25s,transform .25s;white-space:normal}
@media (min-width:480px){.bubble{bottom:calc(7% + 230px * var(--k,.86))}}
.bubble::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-8px;width:16px;height:16px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg) scaleY(.8)}
.bubble[data-hide="1"]{opacity:0;transform:translate(-50%,8px);pointer-events:none}

.stats{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:5;background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:8px 12px;min-width:132px;box-shadow:0 3px 0 rgba(74,53,48,.18)}
.stats .lbl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stats b{font-family:var(--display);font-size:20px;font-weight:600;color:var(--pink-deep);font-variant-numeric:tabular-nums}
.stats .hearts{font-size:15px;letter-spacing:1px;color:var(--pink)}
.stats .hearts i{font-style:normal;color:var(--pink-soft)}
.stats .streak{font-size:12px;font-weight:700;color:var(--green-deep);margin-top:2px}
.side{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:5;display:grid;gap:10px}
.sticker{display:grid;justify-items:center;gap:2px;border:0;background:transparent;padding:0;font-family:var(--display);font-weight:600;font-size:13px;color:var(--ink);text-shadow:-1.5px -1.5px 0 #fff,1.5px -1.5px 0 #fff,-1.5px 1.5px 0 #fff,1.5px 1.5px 0 #fff}
.sticker .ic{width:52px;height:52px;border-radius:18px;background:#fff;border:2.5px solid var(--ink);display:grid;place-items:center;box-shadow:0 3px 0 rgba(74,53,48,.2);position:relative}
.sticker .ic svg{width:34px;height:34px}
.sticker .badge{position:absolute;top:-8px;right:-10px;background:var(--pink-deep);color:#fff;border:2px solid var(--ink);border-radius:99px;font-size:11px;padding:0 6px;line-height:16px;text-shadow:none}
.levelup{position:absolute;inset:0;z-index:7;display:grid;place-items:center;background:rgba(255,244,247,.75);text-align:center;font-family:var(--display);font-size:18px;animation:pop .35s ease}
.levelup b{display:block;font-size:30px;color:var(--pink-deep)}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}

/* ---------- pet switcher ---------- */
.switcher{display:flex;gap:10px;overflow-x:auto;padding:12px 16px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--pink-soft);border-top:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);scrollbar-width:none}
.switcher::-webkit-scrollbar{display:none}
.chip{flex:none;display:grid;justify-items:center;gap:3px;border:0;background:transparent;padding:0;width:64px;font-size:12px;font-weight:800}
.chip .av{width:58px;height:58px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);overflow:hidden;display:grid;place-items:end center;position:relative}
.chip .av svg{width:118%;margin-bottom:-14%}
.chip[aria-pressed="true"] .av{background:var(--green-soft);box-shadow:0 0 0 3px var(--pink-deep)}
.chip .nm{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .ring{position:absolute;inset:-2px;border-radius:50%}
.chip.add .av{background:var(--cream);border-style:dashed;place-items:center;font-family:var(--display);font-size:30px;color:var(--pink-deep)}
.chip .done-dot{position:absolute;top:-2px;right:-2px;width:18px;height:18px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);font-size:10px;display:grid;place-items:center}

/* ---------- panel ---------- */
.panel{padding:18px 16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.phead h1{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1;margin:0;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;border:2px solid var(--ink);background:#fff;white-space:nowrap}
.tag.purpose{background:var(--green-soft)}
.tag.stage{background:var(--pink-soft)}
.r-common{background:#e9f6e2}.r-uncommon{background:#fff1c9}.r-rare{background:var(--pink-soft)}.r-secret{background:linear-gradient(90deg,#ffd9e5,#e1f4d8,#fff1c9)}
.iconbtn{flex:none;width:40px;height:40px;border-radius:14px;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center;box-shadow:0 2px 0 rgba(74,53,48,.2)}
.iconbtn svg{width:20px;height:20px}
.prog .bar{height:16px;border-radius:99px;border:2.5px solid var(--ink);background:#fff;overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--pink) 0 10px,#ffa3c0 10px 20px);border-right:2.5px solid var(--ink);transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.prog .bar i.full{border-right:0;background:repeating-linear-gradient(-45deg,var(--green) 0 10px,#a6dca1 10px 20px)}
.prog .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.grown{border:2.5px solid var(--ink);border-radius:20px;background:var(--green-soft);padding:14px;display:grid;gap:10px;text-align:center}
.grown b{font-family:var(--display);font-size:20px;font-weight:600}
.btn{border:2.5px solid var(--ink);border-radius:16px;background:var(--pink);color:var(--ink);font-family:var(--display);font-weight:600;font-size:17px;padding:11px 18px;box-shadow:0 3px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.green{background:var(--green)}
.btn.plain{background:#fff}
.btn.wide{width:100%}
form.add{display:flex;gap:8px}
form.add input{flex:1;min-width:0;font-size:16px;padding:12px 14px;border-radius:16px;border:2.5px solid var(--ink);background:#fff}
form.add input:focus{outline:none;box-shadow:0 0 0 3px var(--pink-soft)}
form.add .btn{padding:0 18px}
ul.tasks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.task{display:flex;align-items:center;gap:12px;background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:10px 8px 10px 12px}
.task.new{animation:pop .3s ease}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center;padding:0}
.check svg{width:20px;height:20px;opacity:0;transition:opacity .15s}
.task.done{background:var(--paper);border-color:#d9c2bd}
.task.done .check{background:var(--pink)}
.task.done .check svg{opacity:1}
.task .txt{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
.task.done .txt{color:var(--muted);text-decoration:line-through;font-weight:500}
.del{flex:none;width:34px;height:34px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:22px;line-height:1}
.del:active{background:var(--paper)}
.sec{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.sec h2{margin:0;font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted)}
.link{border:0;background:transparent;color:var(--pink-deep);font-weight:800;font-size:13px;padding:4px 6px}
.empty{border:2.5px dashed #e3c9c3;border-radius:18px;padding:18px;text-align:center;color:var(--muted);font-weight:700}
.welcome{text-align:center;display:grid;gap:12px;padding:8px 4px}
.welcome h1{font-family:var(--display);font-size:28px;margin:0}
.welcome p{margin:0;color:var(--muted);font-weight:700}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(74,53,48,.35);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:480px;max-height:92vh;overflow-y:auto;background:var(--cream);border:2.5px solid var(--ink);border-bottom:0;border-radius:28px 28px 0 0;padding:20px 18px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,1.2,.4,1);display:grid;gap:14px;position:relative}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
.sheet h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0;padding-right:44px;text-wrap:balance}
.sheet p.sub{margin:-8px 0 0;color:var(--muted);font-weight:700}
.x{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;font-size:20px;line-height:1;display:grid;place-items:center;padding:0}
.purposes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pcard{border:2.5px solid var(--ink);border-radius:18px;background:#fff;padding:12px 8px;display:grid;gap:4px;justify-items:center;text-align:center}
.pcard b{font-family:var(--display);font-weight:600;font-size:16px}
.pcard span{font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.2}
.pcard .pi{font-size:24px;line-height:1}
.pcard[aria-pressed="true"]{background:var(--pink-soft);box-shadow:0 3px 0 var(--ink)}
.field{display:grid;gap:6px}
.field label{font-weight:800;font-size:13px}
.field input{font-size:16px;padding:12px 14px;border-radius:16px;border:2.5px solid var(--ink);background:#fff;width:100%}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:14px;border:2.5px solid var(--ink);background:#fff;font-family:var(--display);font-size:22px;padding:0}
.stepper output{font-family:var(--display);font-size:26px;font-weight:600;min-width:2.5ch;text-align:center;font-variant-numeric:tabular-nums}
.stepper small{color:var(--muted);font-weight:700}
.boxstage{display:grid;justify-items:center;gap:8px;padding:6px 0;text-align:center}
.boxstage .bx{width:min(62vw,240px);cursor:pointer;animation:boxshake2 1.6s ease-in-out infinite}
@keyframes boxshake2{0%,60%,100%{transform:none}65%{transform:rotate(-5deg) translateY(-6px)}72%{transform:rotate(5deg) translateY(-8px)}80%{transform:rotate(-3deg)}88%{transform:none}}
.bx.opening{animation:none}
.bx.opening .lidg{animation:lidoff .7s ease-in forwards;transform-box:fill-box;transform-origin:50% 100%}
@keyframes lidoff{30%{transform:translateY(-14px) rotate(-6deg)}100%{transform:translate(60px,-160px) rotate(40deg);opacity:0}}
.bx.opening .boxg{animation:squish .7s ease}
@keyframes squish{30%{transform:scale(1.05,.92)}60%{transform:scale(.97,1.04)}}
.tapme{font-family:var(--display);font-weight:600;font-size:18px;color:var(--pink-deep);animation:bob 1.4s ease-in-out infinite}
.reveal{display:grid;justify-items:center;gap:6px;text-align:center;position:relative}
.reveal .rays{position:absolute;top:-10px;width:300px;height:300px;max-width:100%;background:repeating-conic-gradient(from 0deg,rgba(255,143,177,.22) 0 12deg,transparent 12deg 24deg);border-radius:50%;animation:spin 14s linear infinite;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
.reveal .pet{width:min(56vw,210px);position:relative;animation:popin .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.2) translateY(40px);opacity:0}}
.reveal h3{font-family:var(--display);font-size:24px;margin:0;position:relative}
.newbadge{display:inline-block;background:var(--yellow);border:2px solid var(--ink);border-radius:99px;font-size:12px;font-weight:800;padding:1px 8px;margin-left:6px;vertical-align:middle;transform:rotate(-6deg)}
.tabs{display:flex;gap:6px;background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;padding:4px}
.tabs button{flex:1;border:0;border-radius:12px;padding:8px;background:transparent;font-family:var(--display);font-weight:600;font-size:15px}
.tabs button[aria-selected="true"]{background:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{border:2.5px solid var(--ink);border-radius:18px;background:#fff;padding:8px 6px 10px;display:grid;justify-items:center;gap:2px;text-align:center;min-width:0}
.card svg{width:100%;max-width:96px;display:block}
.card b{font-family:var(--display);font-weight:600;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card span{font-size:11px;color:var(--muted);font-weight:700;line-height:1.2}
.card.locked svg{filter:brightness(0) opacity(.13)}
.card.locked{background:var(--paper);border-style:dashed}
.meadowempty{text-align:center;color:var(--muted);font-weight:700;padding:20px 8px}
.eaten{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:40vh;overflow-y:auto}
.eaten li{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;gap:10px;font-weight:700;overflow-wrap:anywhere}
.eaten li span{color:var(--muted);font-size:12px;white-space:nowrap}
.choices{display:grid;gap:8px}
.choice{display:flex;align-items:center;gap:12px;border:2.5px solid var(--ink);border-radius:18px;background:#fff;padding:8px 14px 8px 8px;text-align:left;font-weight:800}
.choice .av{width:48px;height:48px;flex:none;border-radius:50%;background:var(--green-soft);border:2px solid var(--ink);overflow:hidden;display:grid;place-items:end center}
.choice .av svg{width:118%;margin-bottom:-14%}
.danger{color:#c4456b}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;font-weight:800;border-radius:99px;padding:10px 18px;max-width:90%;text-align:center;animation:pop .25s ease}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <section class="scene" id="scene" aria-label="Flower meadow">
    <div class="walkers" id="walkers"></div>
    <div class="hero" id="hero" role="button" tabindex="0" aria-label="Your pet"></div>
    <div class="bubble" id="bubble" data-hide="1"></div>
    <div class="stats" id="stats"></div>
    <div class="side">
      <button class="sticker" id="openMeadow" type="button"><span class="ic" id="meadowIc"></span>meadow</button>
      <button class="sticker" id="openBook" type="button"><span class="ic" id="bookIc"></span>sticker book</button>
    </div>
    <div class="fx" id="fx"></div>
  </section>
  <nav class="switcher" id="switcher" aria-label="Your pets"></nav>
  <main class="panel" id="panel"></main>
</div>
<div id="modalRoot"></div>

<script>
(function(){
"use strict";
/* ================= data ================= */
const SPECIES=[
 {id:"tabby",kind:"cat",name:"Orange Tabby",r:"common",fur:"#ffc77d",fur2:"#fffaf3",mark:"#ee9f4c",inner:"#ffd3d6",line:"#a8673a",eye:"#3d2b26",pat:"stripes"},
 {id:"calico",kind:"cat",name:"Calico Kitty",r:"common",fur:"#fffaf3",fur2:"#fffaf3",mark:"#dba16c",mark2:"#7d5c49",inner:"#ffc9cf",line:"#3d2b26",eye:"#3d2b26",pat:"patch"},
 {id:"cream-bun",kind:"bunny",name:"Cream Bunny",r:"common",fur:"#fffaf0",fur2:"#fffaf0",inner:"#fbe0d6",line:"#d2b19b",eye:"#9c6f62"},
 {id:"cocoa-bear",kind:"bear",name:"Cocoa Bear",r:"common",fur:"#d9a77c",fur2:"#f4d8bb",inner:"#c18b63",line:"#3d2b26",eye:"#3d2b26"},
 {id:"puff-pup",kind:"dog",name:"Puff Pup",r:"common",fur:"#ffffff",fur2:"#ffffff",inner:"#ffffff",line:"#4a3530",eye:"#2b1f1c",style:"fluffy"},

  fl.sort((a,b)=>a[1]-b[1]).forEach(([x,y])=>{const k=(y-160)/180,r=1.6+k*6.5,c=R();
    if(R()<.22)s+=`<path d="M${x.toFixed(1)} ${y.toFixed(1)} l-${(2+k*3).toFixed(1)} -${(4+k*6).toFixed(1)} M${x.toFixed(1)} ${y.toFixed(1)} l${(2+k*3).toFixed(1)} -${(4+k*6).toFixed(1)}" stroke="#7cc47a" stroke-width="${1+k*1.5}" stroke-linecap="round"/>`;
    else s+=flower(+x.toFixed(1),+y.toFixed(1),+r.toFixed(1),c<.45?"#ffadc6":c<.75?"#ff8fb1":c<.92?"#ffffff":"#ffd9e5");});
  return s+`</svg>`;
}
function sceneFG(){
  const R=rng(42);let s=`<svg class="fg" viewBox="0 0 400 60" preserveAspectRatio="xMidYMax slice" aria-hidden="true">`;
  for(let i=0;i<9;i++)s+=`<ellipse cx="${R()*400}" cy="${50+R()*10}" rx="${10+R()*8}" ry="5" fill="#8fcf85" transform="rotate(${R()*60-30})" />`;
  for(let x=-10;x<420;x+=26+R()*14){const y=30+R()*26,c=R();s+=flower(+x.toFixed(1),+y.toFixed(1),+(8+R()*6).toFixed(1),c<.5?"#ff8fb1":c<.8?"#ffb3cb":"#ffffff")}
  return s+`</svg>`;
}

function feed(p,t){
  const before=stageOf(p);
  t.fed=true;p.fed++;p.lastFed=Date.now();(p.eaten=p.eaten||[]).push({t:t.text,at:Date.now()});
  const k=dkey();S.days[k]=(S.days[k]||0)+1;
  const ks=Object.keys(S.days).sort();while(ks.length>120)delete S.days[ks.shift()];
  if(p.fed>=p.goal&&!p.grownAt)p.grownAt=Date.now();
  save();render();anim("jump");burst(5);
  const after=stageOf(p);
  if(after>before)setTimeout(()=>levelUp(p,after),550);else say(pick(FED));
}
document.addEventListener("click",e=>{
  const nb=e.target.closest("[data-new]");if(nb){newPetFlow();return}
  const chip=e.target.closest("[data-pet]");if(chip){S.active=chip.dataset.pet;save();render();const p=cur();say(`hiii it's ${p.name}!`);anim("wiggle");return}
  const b=e.target.closest("[data-act]");
  if(b&&b.closest("#panel")){
    const p=cur(),id=b.closest("[data-task]").dataset.task,t=p.tasks.find(x=>x.id===id);if(!t)return;

});
